services:
  postgres:
    image: postgres:17
    container_name: borderlessos-postgres

    environment:
      POSTGRES_DB: borderlessos
      POSTGRES_USER: borderlessos_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}

    ports:
      - "5432:5432"

    volumes:
      - borderlessos_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U borderlessos_app -d borderlessos"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  borderlessos_postgres_data: